# Layout and style for the comparison PDF. The build script reads these values.
# Change a value here to restyle every future PDF. Section order is fixed in the script.

[page]
orientation = landscape
margin_inches = 0.6

[colors]
deal_a = #2F6DB5
deal_b = #D9822B
equity = #7B6AA8
heading = #1F4F8A
grid = #BFBFBF
header_fill = #F2F2F2

[type]
title_size = 18
heading_size = 12
body_size = 8.5
note_size = 7.5

[tables]
# Column widths as shares of the page width. Each list adds to 1.
headline = 0.34, 0.33, 0.33
scorecard = 0.10, 0.06, 0.09, 0.26, 0.06, 0.09, 0.34
repayment = 0.22, 0.78
screening = 0.20, 0.20, 0.15, 0.45
